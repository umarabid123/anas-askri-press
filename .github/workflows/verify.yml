name: Verify POS
on: [push, pull_request, workflow_dispatch]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  desktop:
    runs-on: windows-latest
    # Cloud sync settings come from repository secrets (.env is not committed).
    # Without them the installer still works fully offline.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Desktop Installer
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri:build -- --bundles nsis
          else
            npm run tauri:build -- --bundles nsis --no-sign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anas-arki-press-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
